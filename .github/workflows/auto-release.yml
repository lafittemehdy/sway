name: Auto Release

on:
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - react-sway/package.json

permissions:
  contents: write

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  auto-release:
    name: Auto-release on dependency update
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.actor == 'dependabot[bot]' || contains(github.event.head_commit.message, 'build(deps') || contains(github.event.head_commit.message, 'dependabot')

    steps:
      - name: Check release token
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::RELEASE_TOKEN is required to push version tags and trigger publishing."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          package-manager-cache: false

      - name: Install canonical npm
        run: npm install --global npm@11.18.0

      - name: Sync branch
        run: git pull --ff-only origin "${GITHUB_REF_NAME}"

      - name: Validate workspace metadata
        run: node scripts/check-workspace.mjs

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Detect manual package version change
        id: manual-version
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          OLD_VERSION="$(git show "$BEFORE:react-sway/package.json" | node -e "let data = ''; process.stdin.on('data', chunk => data += chunk); process.stdin.on('end', () => console.log(JSON.parse(data).version));")"
          NEW_VERSION="$(node -p "require('./react-sway/package.json').version")"

          if [ "$OLD_VERSION" != "$NEW_VERSION" ]; then
            echo "Manual version change detected: $OLD_VERSION -> $NEW_VERSION"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump react-sway patch version
        id: bump
        if: steps.manual-version.outputs.changed != 'true'
        run: |
          npm version patch --workspace=react-sway --no-git-tag-version
          VERSION="v$(node -p "require('./react-sway/package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          npm install --package-lock-only

      - name: Validate updated workspace metadata
        if: steps.manual-version.outputs.changed != 'true'
        run: node scripts/check-workspace.mjs

      - name: Commit and tag version bump
        if: steps.manual-version.outputs.changed != 'true'
        run: |
          git add package-lock.json react-sway/package.json
          git commit -m "chore: bump version to ${{ steps.bump.outputs.version }}"
          git tag "${{ steps.bump.outputs.version }}"
          git push origin "HEAD:${GITHUB_REF_NAME}" "${{ steps.bump.outputs.version }}"

      - name: Create GitHub Release
        if: steps.manual-version.outputs.changed != 'true'
        run: |
          gh release create "${{ steps.bump.outputs.version }}" \
            --title "${{ steps.bump.outputs.version }}" \
            --notes "Automated release for dependency updates." \
            --latest
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
