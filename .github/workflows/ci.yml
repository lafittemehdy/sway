name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: npm
          cache-dependency-path: package-lock.json
          node-version: ${{ matrix.node-version }}

      - name: Validate workspace metadata
        run: node scripts/check-workspace.mjs

      - name: Install workspace dependencies
        run: npm ci

      - name: Build react-sway
        run: npm run build --workspace=react-sway

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm run test --workspace=react-sway

  build-check:
    name: Build verification
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: npm
          cache-dependency-path: package-lock.json
          node-version: 22.x

      - name: Validate workspace metadata
        run: node scripts/check-workspace.mjs

      - name: Install workspace dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Build react-sway
        run: npm run build --workspace=react-sway

      - name: Build demo app
        run: npm run build

      - name: Verify package can be packed
        run: npm pack --workspace=react-sway --dry-run

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [test, build-check]
    if: always()
    steps:
      - name: Verify required jobs
        run: |
          for result in "${{ needs.test.result }}" "${{ needs.build-check.result }}"; do
            if [ "$result" != "success" ]; then
              echo "CI did not pass."
              exit 1
            fi
          done
