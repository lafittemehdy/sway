name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Install canonical npm
        run: npm install --global npm@11.18.0

      - name: Show tool versions
        run: |
          node --version
          npm --version

      - name: Validate workspace metadata
        run: node scripts/check-workspace.mjs

      - name: Install workspace dependencies
        run: npm ci

      - name: Build react-sway
        run: npm run build --workspace=react-sway

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test --workspace=react-sway

      - name: Publish with trusted publishing (OIDC)
        run: npm publish --workspace=react-sway --access public
