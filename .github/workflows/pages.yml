name: Deploy Demo to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "react-sway/src/**"
      - "vite.config.ts"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pages: write

concurrency:
  cancel-in-progress: false
  group: pages

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            react-sway/package-lock.json
          node-version: 24.x

      - name: Install root dependencies
        run: npm ci

      - name: Install react-sway dependencies
        run: cd react-sway && npm ci

      - name: Build react-sway
        run: cd react-sway && npm run build

      - name: Build demo app
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
